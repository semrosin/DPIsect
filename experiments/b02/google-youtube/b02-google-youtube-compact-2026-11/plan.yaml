        - SIGINT
    max_syn_retransmissions: 1
classification_rule: |
    TLS profile uses GODEBUG=tlsmlkem=0 for both names.
    This is a two-connection feasibility pilot on one Google address, not the
    full B02 address matrix. Record each TCP/TLS outcome, certificate validation,
    captured packets, actual ClientHello sizes and capture limitations. Different
    outcomes do not distinguish server behavior from network interference, and
    the names and generated ClientHellos may have different lengths. Neither TLS
    handshake alone determines website availability. B02 remains inconclusive.
wire_notes: TCP segmentation and retransmissions are kernel-managed; TLS after ClientHello depends on the server; TLS randomness uses crypto/rand, not schedule seed; capture continues up to 1.5s after the final successful probe
