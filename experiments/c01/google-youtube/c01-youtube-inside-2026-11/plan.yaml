classification_rule: |
    This exploratory pilot records only attempts actually started. Compare
    attempts only if each first ClientHello and actual TCP segmentation
    match its saved plan and capture has no drops. Identify retransmissions
    and incoming frames using PCAP. Unmatched layouts, incomplete capture,
    or insufficient observations yield inconclusive. A reproducible effect
    requires a separately planned repeated series.
wire_notes: TCP segmentation and retransmissions are kernel-managed; TLS after ClientHello depends on the server; TLS randomness uses crypto/rand, not schedule seed; capture continues up to 1.5s after the final completed trial if the series is not canceled; planned split offsets describe two application writes, not guaranteed TCP segment boundaries
