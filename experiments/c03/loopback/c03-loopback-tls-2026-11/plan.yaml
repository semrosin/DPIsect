question_id: C03
experiment_id: c03-loopback-tls-2026-11
endpoint: {role: lab, ip: 127.0.0.1, port: ephemeral}
mode: valid-session
scope: "Совместимость локального TLS-сервера с двумя порядками доставки TCP-сегментов ClientHello."
planned_wire_packets:
  tcp_split_offsets: [32]
  tls_layout: "Один TLS record ClientHello. Используются свежие случайные поля каждой сессии."
  control: {delay_ms: 30, expected_first_seen_offsets: [0, 32]}
  treatment: {delay_ms: 30, reorder_percent: 100, gap: 2, expected_first_seen_offsets: [32, 0]}
  transport: "Обычный TCP/IPv4 в изолированном loopback. SEQ, ACK, TTL и checksum выбирает ядро."
  response: "Проверенный TLS 1.3 и заранее заданный HTTP-ответ."
schedule: {repetitions: 3, seed: null, state_reset: "Новый TCP-сеанс на попытку, профиль netem применяется перед ClientHello."}
budget:
  max_captured_frames_per_attempt: 64
  deadline_s_per_connection: 5
  deadline_s_child: 20
  rationale: "Изолированный стенд, фиксированное число попыток. Три прогона проверяют повторение наблюдения."
  stop_conditions: ["ошибка TLS, tc или capture", "дедлайн", "64 кадра без входящего FIN"]
classification_rule:
  compatibility_confirmed: "Во всех трёх прогонах PCAP показывает заданный порядок и сохранённую границу. Все сессии проверили сертификат и получили заданный HTTP-ответ."
  compatibility_inconclusive: "Нет подтверждения порядка или одна из попыток не завершилась. Ошибка разбирается отдельно."
  route_result: "На стенде измеряется реакция TLS-сервера. Реакция DPI остаётся неизвестной."
