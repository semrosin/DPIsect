question_id: B01
experiment_id: b01-google-youtube-repeat-2026-11
mode: valid-session
sni: www.google.com
paired_sni: www.youtube.com
paired_timeout_ms: 5000
paired_client_hello_delay_ms: 1100
paired_close_delay_ms: 1100
paired_hello:
  control: {record_length: 260, sni_offset: 110, ignored_data: neutral}
  treatment: {record_length: 260, sni_offset: 110, ignored_data: neutral}
endpoint: {role: target, ip: 142.251.155.119, port: 443}
budget:
  max_packets: 100
  max_bytes: 102400
  max_rate_pps: 10
  max_duration_s: 60
  max_syn_retransmissions: 1
  stop_conditions: [first repeated SYN, outgoing data or FIN retransmission, budget threshold, capture error or drops, abnormal channel behavior, SIGINT]
schedule: {repetitions: 2, seed: 0, inter_trial_gap_ms: 3000, state_reset: none}
capture: {client: artifacts/b01-google-youtube-repeat-2026-11/client.pcap}
runner_log: artifacts/b01-google-youtube-repeat-2026-11/runner.log
classification_rule: |
  This target pilot does not replace canonical B01 on a helper route.
  Record a repeated client-observed difference only if both Google TLS sessions
  complete with certificate verification and both YouTube attempts send the
  planned ClientHello but do not complete TLS, in both pair orders, with no
  monitor stop, capture drops or ambiguity and with plan-versus-PCAP validation.
  Any other outcome is inconclusive for this rule. Even a repeated difference
  does not establish server acceptance, SNI filtering, device attribution or
  canonical B01; B01 remains inconclusive without the missing observations.
  Never count an unstarted trial or automatically restart a stopped series.
