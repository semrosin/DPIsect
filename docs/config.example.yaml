# Example experiment config. Copy to
# experiments/<question_id>/<series>/<experiment_id>/config.yaml and edit.
# Schema: internal/runner (Config); report front-matter:
# docs/EXPERIMENTS.md §4; safety limits: docs/SAFETY.md §3.

question_id: B01
experiment_id: b01-sni-padding-2026-11
mode: valid-session # valid-session | raw-experiment
sni: example.com # ClientHello SNI (required for valid-session)
# paired_sni: web.telegram.org # optional treatment; sni is the control
# schedule.repetitions becomes the number of pairs for offline preparation.
# paired_timeout_ms: 5000 # per-attempt TCP/TLS deadline
# paired_client_hello_delay_ms: 1100 # optional delay after TCP; shorter than timeout
# paired_close_delay_ms: 1100 # optional pause after successful TLS; both delays fit the timeout
# paired_hello: # optional B04/B07 TLS 1.2 profile; both coordinates are bytes
#   control: {record_length: 250, sni_offset: 110, ignored_data: blocked.example}
#   treatment: {record_length: 250, sni_offset: 130, ignored_data: blocked.example}
# sni_offset is measured from the start of the TLS record to the hostname.
# -prepare-sni writes only a logical schedule; execution requires -capture-iface.
# TCP-only alternative: set tcp_only: true and tcp_timeout_ms: 5000;
# omit both sni and paired_sni. No application data is sent.

endpoint:
  role: helper # lab | helper | target (raw is forbidden for target)
  ip: 192.0.2.10
  port: 443

budget: # zero fields default to docs/SAFETY.md §3 limits
  max_packets: 100
  max_bytes: 102400
  max_rate_pps: 10
  max_duration_s: 60
  max_syn_retransmissions: 1 # required for TCP-only and paired runs
  stop_conditions: []

schedule:
  repetitions: 5
  seed: 42
  inter_trial_gap_ms: 100
  state_reset: none # how state is cleared between repetitions

# Preflight availability checks before the series (G01, G02).
preflight:
  enabled: false
  host: "" # name resolved by both sources, e.g. blocked.example
  independent_resolver: "" # second source, e.g. 8.8.8.8:53

# Lab impairment profile (internal/lab); config_id is recorded in
# run.json as lab_config_id (H07).
lab:
  enabled: false
  config_id: ""
  loss_percent: 0.0
  reorder_percent: 0.0
  delay_ms: 0
  mtu: 0 # 0 = leave link MTU unchanged

capture: # outside git, see docs/SAFETY.md §5
  client: artifacts/b01-sni-padding-2026-11/client.pcap
  server: artifacts/b01-sni-padding-2026-11/server.pcap
helper_log: artifacts/b01-sni-padding-2026-11/helper.log
runner_log: artifacts/b01-sni-padding-2026-11/runner.log

# Must be fixed before the first packet is sent
# (docs/EXPERIMENTS.md §2).
classification_rule: |
  Control and treatment differ only in the SNI value. Confirmed iff the
  control profile succeeds and the treatment profile is blocked across
  all repetitions with identical budget and schedule; refuted if the
  treatment succeeds; inconclusive if observations are insufficient.
